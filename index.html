<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Đột biến gene - Sinh học 12</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0}.wrap{max-width:850px;margin:auto;padding:25px 16px}.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 30px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.timer{font-weight:bold;background:#fff3cd;padding:10px;border-radius:10px}.bar{height:8px;background:#4f46e5;width:0}.track{height:8px;background:#e8edf5;margin:15px 0}.q{font-size:21px;font-weight:bold;line-height:1.45}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0;font-size:16px;cursor:pointer}.opt.sel{background:#eef2ff;border-color:#4f46e5}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#4f46e5;color:#fff}.secondary{background:#e9eef7}.danger{background:#dc2626;color:#fff}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:20px}.grid button{padding:7px;background:#eef1f6}.grid .done{background:#c7d2fe}.grid .cur{outline:2px solid #4f46e5}.hidden{display:none}.score{font-size:45px;font-weight:800;color:#4f46e5;text-align:center}.wrong{background:#fff1f2;padding:14px;border-radius:10px;margin:9px 0}.correct{color:#15803d;font-weight:bold}@media(max-width:600px){.grid{grid-template-columns:repeat(6,1fr)}.q{font-size:18px}}
</style></head><body><div class="wrap">
<div class="card" id="quiz"><div class="top"><div><h1>🧬 Quiz Đột biến gene</h1><div>32 câu • 15 phút</div></div><div class="timer" id="timer">15:00</div></div>
<div class="track"><div class="bar" id="bar"></div></div><b id="num"></b><div class="q" id="question"></div><div id="options"></div>
<div class="nav"><button class="secondary" id="prev">← Trước</button><button class="primary" id="next">Tiếp →</button><button class="danger hidden" id="submit">Nộp bài</button></div><div class="grid" id="grid"></div></div>
<div class="card hidden" id="result"><h1>🎉 Kết quả</h1><div class="score" id="score"></div><p id="summary"></p><button class="primary" onclick="location.reload()">Làm lại</button><div id="review"></div></div>
</div><script>
const qs=[{"q": "Đột biến gene là những thay đổi của gì?", "options": ["Điều kiện môi trường", "Gene liên quan đến một hay một số cặp nucleotide", "Chức năng của protein", "Trình tự amino acid"], "answer": 1}, {"q": "Đột biến liên quan đến một số cặp nucleotide được gọi là gì?", "options": ["Đột biến điểm", "Đột biến vô nghĩa", "Đột biến sai nghĩa", "Đột biến đồng nghĩa"], "answer": 0}, {"q": "Đột biến gene làm xuất hiện gì?", "options": ["Các protein mới", "Các amino acid mới", "Các allele mới", "Các tác nhân đột biến"], "answer": 2}, {"q": "Tần số đột biến gene phụ thuộc vào những yếu tố nào?", "options": ["Điều kiện môi trường, cấu trúc và kích thước của gene", "Chỉ kích thước của gene", "Chỉ điều kiện môi trường", "Vật lí, hóa học, sinh học"], "answer": 0}, {"q": "Tần số đột biến 1 gene bất kì khoảng bao nhiêu?", "options": ["10⁻² – 10⁻¹", "10⁻⁶ – 10⁻⁴", "10⁻⁴ – 10⁻²", "10⁻⁸ – 10⁻⁶"], "answer": 1}, {"q": "Có những dạng đột biến gene nào?", "options": ["Đồng nghĩa, vô nghĩa, sai nghĩa", "Vật lí, hóa học, sinh học", "Thêm một cặp nu, mất một cặp nu và thay thế một cặp nu", "Có lợi, có hại và trung tính"], "answer": 2}, {"q": "Đột biến thay thế một cặp nucleotide có thể làm thay đổi gì?", "options": ["Trình tự amino acid trong chuỗi polypeptide và chức năng của protein", "Chỉ điều kiện môi trường", "Chỉ kích thước của gene", "Nguồn nguyên liệu cho tiến hóa"], "answer": 0}, {"q": "Đột biến thay thế nhưng không thay đổi trình tự amino acid là?", "options": ["Vô nghĩa", "Sai nghĩa", "Dịch khung", "Đồng nghĩa"], "answer": 3}, {"q": "Đột biến tạo ra bộ ba kết thúc là?", "options": ["Đồng nghĩa", "Vô nghĩa", "Sai nghĩa", "Dịch khung"], "answer": 1}, {"q": "Đột biến làm thay đổi 1 amino acid là?", "options": ["Đồng nghĩa", "Vô nghĩa", "Sai nghĩa", "Thêm một cặp nu"], "answer": 2}, {"q": "Thêm hoặc mất một cặp nu còn gọi là gì?", "options": ["Đột biến điểm", "Dịch khung", "Đồng nghĩa", "Vô nghĩa"], "answer": 1}, {"q": "Đột biến dịch khung làm thay đổi gì?", "options": ["Trình tự amino acid kể từ một vị trí trở về sau", "Chỉ một amino acid", "Chỉ bộ ba kết thúc", "Điều kiện môi trường"], "answer": 0}, {"q": "Nguyên nhân tự phát của đột biến gene là gì?", "options": ["Tia phóng xạ", "Hiện tượng cặp nhầm trong tái bản DNA", "EMS", "Một số virus"], "answer": 1}, {"q": "Có mấy nhóm tác nhân đột biến?", "options": ["Hai nhóm", "Ba nhóm: vật lí, hóa học, sinh học", "Bốn nhóm", "Một nhóm"], "answer": 1}, {"q": "Tia phóng xạ, tia tử ngoại, tia UV, nhiệt thuộc tác nhân nào?", "options": ["Hóa học", "Sinh học", "Vật lí", "Tự phát"], "answer": 2}, {"q": "EMS, NMV thuộc tác nhân nào?", "options": ["Vật lí", "Hóa học", "Sinh học", "Tự phát"], "answer": 1}, {"q": "Viêm gan B, HPV thuộc tác nhân nào?", "options": ["Vật lí", "Hóa học", "Sinh học", "Tự phát"], "answer": 2}, {"q": "Cơ chế đột biến thêm cặp nucleotide?", "options": ["1 nu không được làm khuôn", "Một nucleotide được sử dụng làm khuôn 2 lần", "Một số chất có cấu trúc giống base bình thường được gắn vào mạch mới", "Tia UV làm 2T trên 1 mạch liên kết với nhau"], "answer": 1}, {"q": "Kết quả của việc một nucleotide được sử dụng làm khuôn 2 lần?", "options": ["Mạch mới tổng hợp sẽ có thêm một nucleotide", "Mạch mới tổng hợp bị mất một nu", "Xuất hiện bộ ba kết thúc", "Không đổi trình tự amino acid"], "answer": 0}, {"q": "Cơ chế đột biến mất cặp nucleotide?", "options": ["Một nucleotide được sử dụng làm khuôn 2 lần", "1 nu không được làm khuôn", "Một số chất có cấu trúc giống base bình thường được gắn vào mạch mới", "Tia UV làm 2T liên kết với nhau"], "answer": 1}, {"q": "Khi 1 nu không được làm khuôn thì điều gì xảy ra?", "options": ["Mạch mới tổng hợp sẽ có thêm một nucleotide", "Mạch mới tổng hợp bị mất một nu", "Xuất hiện allele mới", "Không đổi trình tự amino acid"], "answer": 1}, {"q": "Cơ chế đột biến thay thế cặp nu?", "options": ["1 nu không được làm khuôn", "Một nucleotide được sử dụng làm khuôn 2 lần", "Một số chất có cấu trúc giống base bình thường được gắn vào mạch mới", "Tia phóng xạ làm mất một nu"], "answer": 2}, {"q": "Đa số đột biến có đặc điểm như thế nào?", "options": ["Có lợi", "Có hại", "Trung tính", "Không xác định"], "answer": 1}, {"q": "Ngoài đột biến có hại còn có những loại nào?", "options": ["Có lợi và trung tính", "Vật lí và hóa học", "Đồng nghĩa và dịch khung", "Tự phát và sinh học"], "answer": 0}, {"q": "Đột biến gene được sử dụng trong nghiên cứu di truyền để xác định gì?", "options": ["Gene trội/lặn, các quy luật di truyền, dự đoán sự biểu hiện tính trạng tương ứng ở thế hệ tiếp theo", "Chỉ chức năng gene", "Chỉ bảng mã di truyền", "Chỉ giống mới"], "answer": 0}, {"q": "Đột biến gene được sử dụng để làm gì trong nghiên cứu mã di truyền?", "options": ["Tạo ra giống mới", "Xây dựng bảng mã di truyền", "Hình thành loài mới", "Dự đoán điều kiện môi trường"], "answer": 1}, {"q": "Đột biến gene giúp nghiên cứu gì?", "options": ["Chức năng gene", "Nhiệt", "Tia UV", "Tác nhân hóa học"], "answer": 0}, {"q": "Đột biến gene giúp làm sáng tỏ mối quan hệ nào?", "options": ["Mối quan hệ giữa điều kiện môi trường và gene", "Mối quan hệ giữa gene và protein", "Mối quan hệ giữa tia UV và protein", "Mối quan hệ giữa virus và loài mới"], "answer": 1}, {"q": "Dựa vào thể đột biến có thể làm gì?", "options": ["Xây dựng bảng mã di truyền", "Phát hiện các đột biến có lợi hoặc có hại", "Tạo ra bộ ba kết thúc", "Xác định kích thước của gene"], "answer": 1}, {"q": "Trong chọn giống, đột biến gene có vai trò gì?", "options": ["Tạo ra giống mới", "Cung cấp nguồn nguyên liệu cho quá trình tiến hóa", "Xây dựng bảng mã di truyền", "Xác định gene trội/lặn"], "answer": 0}, {"q": "Trong tiến hóa, đột biến cung cấp gì?", "options": ["Giống mới", "Nguồn nguyên liệu cho quá trình tiến hóa", "Chức năng protein", "Tác nhân đột biến"], "answer": 1}, {"q": "Đột biến giúp giải thích điều gì?", "options": ["Tính đa dạng của sinh giới, cơ chế góp phần hình thành loài mới", "Chỉ chức năng gene", "Chỉ bảng mã di truyền", "Chỉ các tác nhân vật lí"], "answer": 0}];let cur=0,ans=Array(qs.length).fill(null),time=900,done=false;
const $=x=>document.getElementById(x);
function render(){let x=qs[cur];$('num').textContent=`Câu ${cur+1}/${qs.length}`;$('question').textContent=x.q;$('options').innerHTML=x.options.map((v,i)=>`<button class="opt ${ans[cur]===i?'sel':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('');$('bar').style.width=((cur+1)/qs.length*100)+'%';$('prev').disabled=cur===0;$('next').classList.toggle('hidden',cur===qs.length-1);$('submit').classList.toggle('hidden',cur!==qs.length-1);$('grid').innerHTML=qs.map((_,i)=>`<button class="${i===cur?'cur':''} ${ans[i]!==null?'done':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function pick(i){ans[cur]=i;render()}function go(i){cur=i;render()}$('prev').onclick=()=>{if(cur){cur--;render()}};$('next').onclick=()=>{if(cur<qs.length-1){cur++;render()}};$('submit').onclick=()=>finish(false);
function finish(auto){if(done)return;done=true;let c=qs.filter((x,i)=>ans[i]===x.answer).length;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${c}/${qs.length}`;$('summary').textContent=`Đúng ${c} câu (${Math.round(c/qs.length*100)}%).${auto?' Hết giờ, bài đã tự nộp.':''}`;$('review').innerHTML='<h2>Câu sai</h2>'+qs.map((x,i)=>ans[i]===x.answer?'':`<div class="wrong"><b>Câu ${i+1}:</b> ${x.q}<br>Bạn chọn: ${ans[i]===null?'Chưa chọn':x.options[ans[i]]}<br><span class="correct">Đáp án đúng: ${x.options[x.answer]}</span></div>`).join('')}
function tick(){let m=Math.floor(time/60),s=time%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(time<=0){finish(true);return}time--;setTimeout(tick,1000)}render();tick();
</script></body></html>
